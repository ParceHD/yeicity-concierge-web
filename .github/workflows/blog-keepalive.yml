# Mantiene despierto el proyecto gratuito de Supabase (se pausa tras 7 días sin actividad).
# Cada 3 días hace una lectura de los artículos publicados con la clave pública.
# Para activarlo: copiar este archivo a .github/workflows/blog-keepalive.yml en el repo (necesita permiso "workflow").
name: Blog · mantener Supabase activo
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer artículos publicados
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" assets/js/blog-config.js || true)
          KEY=$(grep -oP "anonKey:\s*'\K[^']+" assets/js/blog-config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Blog sin configurar todavía"; exit 0; fi
          curl -sf "$URL/rest/v1/blog_posts?select=id&estado=eq.publicado&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          echo "Supabase respondió correctamente"
